name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: newtonite
          POSTGRES_USER: newtonite
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newtonite -d newtonite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply schema migrations to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://newtonite:ci-only-password@localhost:5432/newtonite
        run: python -m alembic upgrade head
      - name: Run API checks
        working-directory: backend
        run: python -m pytest -q
      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit -r backend/requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit JavaScript dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build production containers
        run: docker compose --env-file .env.example build
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Chromium end-to-end scenarios
        working-directory: frontend
        run: npm run e2e
      - name: Upload Chromium report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-test-journey
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
